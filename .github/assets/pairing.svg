<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<title id="t">Pairing a guest with a host</title>
<desc id="d">Stepper. One: the host runs csync host and waits, advertising over Bonjour. Two: the guest runs csync join, sees the host and presses join. Three: both screens show the same code, 7KQ4 M2XD, and the host presses accept. Then the project is mounted on the guest and the keys are pinned so later reconnects need no code.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<style>.s{display:none}@media (prefers-reduced-motion: reduce){.m{display:none}.s{display:inline}}</style>
<rect width="960" height="300" rx="18" fill="#0d1117"/>
<rect x="1" y="1" width="958" height="298" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
<text x="24" y="34" font-size="13" font-weight="700" fill="#c9d1d9">joining takes three steps</text>
<text x="936" y="34" text-anchor="end" font-size="12" fill="#8b949e">a human checks the code once, keys are pinned</text>
<g shape-rendering="crispEdges">
<rect x="152" y="70" width="656" height="4" fill="#30363d"/>
<rect class="m" x="152" y="70" width="0" height="4" fill="url(#g)"><animate attributeName="width" values="0;656;656;0" keyTimes="0;0.7;0.95;1" dur="8s" repeatCount="indefinite"/></rect>
<rect class="s" x="152" y="70" width="656" height="4" fill="url(#g)"/>
<rect x="124" y="58" width="28" height="28" fill="#161b22" stroke="#2dd4bf" stroke-width="3"/>
<rect class="m" x="127" y="61" width="22" height="22" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0.3;0" keyTimes="0;0.000;0.030;0.95;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="352" y="58" width="28" height="28" fill="#161b22" stroke="#6ab0dd" stroke-width="3"/>
<rect class="m" x="355" y="61" width="22" height="22" fill="#6ab0dd" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0.3;0" keyTimes="0;0.233;0.263;0.95;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="580" y="58" width="28" height="28" fill="#161b22" stroke="#a78bfa" stroke-width="3"/>
<rect class="m" x="583" y="61" width="22" height="22" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0.3;0" keyTimes="0;0.467;0.497;0.95;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="808" y="58" width="28" height="28" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
<rect class="m" x="811" y="61" width="22" height="22" fill="#3fb950" opacity="0"><animate attributeName="opacity" values="0;0;0.3;0.3;0" keyTimes="0;0.700;0.730;0.95;1" dur="8s" repeatCount="indefinite"/></rect>
</g>
<text x="138" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#c9d1d9">1</text>
<text x="366" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#c9d1d9">2</text>
<text x="594" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#c9d1d9">3</text>
<path d="M813 72l6 6l11 -12" fill="none" stroke="#3fb950" stroke-width="3"/>
<rect x="34" y="104" width="208" height="172" fill="#0d1117" stroke="#30363d" stroke-width="4" shape-rendering="crispEdges"/>
<text x="48" y="130" font-size="13" font-weight="700" fill="#c9d1d9">host waits</text>
<rect x="46" y="144" width="184" height="26" fill="#161b22" shape-rendering="crispEdges"/>
<text x="56" y="162" font-size="12" fill="#2dd4bf">$ csync host</text>
<text x="48" y="200" font-size="11" fill="#8b949e">advertises over Bonjour</text>
<text x="48" y="220" font-size="11" fill="#8b949e">waits for a guest</text>
<rect x="262" y="104" width="208" height="172" fill="#0d1117" stroke="#30363d" stroke-width="4" shape-rendering="crispEdges"/>
<text x="276" y="130" font-size="13" font-weight="700" fill="#c9d1d9">guest joins</text>
<rect x="274" y="144" width="184" height="26" fill="#161b22" shape-rendering="crispEdges"/>
<text x="284" y="162" font-size="12" fill="#a78bfa">$ csync join</text>
<text x="276" y="200" font-size="11" fill="#8b949e">sees the host listed</text>
<text x="276" y="220" font-size="11" fill="#8b949e">presses join</text>
<rect x="490" y="104" width="208" height="172" fill="#0d1117" stroke="#30363d" stroke-width="4" shape-rendering="crispEdges"/>
<text x="504" y="130" font-size="13" font-weight="700" fill="#c9d1d9">compare, accept</text>
<rect x="502" y="144" width="184" height="26" fill="#161b22" stroke="url(#g)" stroke-width="2" shape-rendering="crispEdges"/>
<text x="512" y="162" font-size="12" fill="#2dd4bf">host</text>
<text x="676" y="162" text-anchor="end" font-size="13" font-weight="700" fill="#c9d1d9">7KQ4 M2XD</text>
<rect x="502" y="176" width="184" height="26" fill="#161b22" stroke="url(#g)" stroke-width="2" shape-rendering="crispEdges"/>
<text x="512" y="194" font-size="12" fill="#a78bfa">guest</text>
<text x="676" y="194" text-anchor="end" font-size="13" font-weight="700" fill="#c9d1d9">7KQ4 M2XD</text>
<text x="504" y="232" font-size="11" fill="#8b949e">same code on both sides</text>
<text x="504" y="252" font-size="11" fill="#8b949e">host presses accept</text>
<rect x="718" y="104" width="208" height="172" fill="#0d1117" stroke="#30363d" stroke-width="4" shape-rendering="crispEdges"/>
<text x="732" y="130" font-size="13" font-weight="700" fill="#c9d1d9">mounted</text>
<rect x="730" y="144" width="184" height="26" fill="#161b22" shape-rendering="crispEdges"/>
<text x="740" y="162" font-size="12" fill="#3fb950">~/proj is live</text>
<text x="732" y="200" font-size="11" fill="#8b949e">keys pinned (Noise IK)</text>
<text x="732" y="220" font-size="11" fill="#8b949e">no code next time</text>
</svg>
