<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="960" height="484" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
<title id="t">csync security layers</title>
<desc id="d">Six layers stand between a hostile network and the project tree, and each one stops a named attack. One: Noise XX pairing with an 8 character code that a human compares, which stops a man in the middle on first contact. Two: pinned keys with Noise IK on every later connection, which stops an impostor host and replay. Three: every file operation is opened beneath the project root without following symlinks, which stops path escapes. Four: gitignored files never leave the host, which stops secrets leaking. Five: .git is read-only to the guest, which stops history rewrites. Six: every length is bounded before anything is allocated, which stops a peer exhausting memory. Also: rate limits per address, private key files, bytes checked with BLAKE3, and a guest that keeps nothing after it leaves.</desc>
<rect width="960" height="484" rx="18" fill="#0d1117"/>
<rect x="1" y="1" width="958" height="482" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
<text x="32" y="38" font-size="13" font-weight="700" fill="#c9d1d9">what stands between the network and your project</text>
<text x="928" y="38" text-anchor="end" font-size="11" fill="#8b949e">the attacker can read, inject, replay and spoof mDNS</text>
<g shape-rendering="crispEdges">
<rect x="32" y="64" width="280" height="280" fill="#0d1117" stroke="#2dd4bf" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.000;0.100;0.200;1" dur="6s" repeatCount="indefinite"/></rect>
<rect x="52" y="84" width="240" height="240" fill="none" stroke="#4cc2ce" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.125;0.225;0.325;1" dur="6s" repeatCount="indefinite"/></rect>
<rect x="72" y="104" width="200" height="200" fill="none" stroke="#5cb9d5" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.250;0.350;0.450;1" dur="6s" repeatCount="indefinite"/></rect>
<rect x="92" y="124" width="160" height="160" fill="none" stroke="#6ab0dd" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.375;0.475;0.575;1" dur="6s" repeatCount="indefinite"/></rect>
<rect x="112" y="144" width="120" height="120" fill="none" stroke="#899deb" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.500;0.600;0.700;1" dur="6s" repeatCount="indefinite"/></rect>
<rect x="132" y="164" width="80" height="80" fill="none" stroke="#a78bfa" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.625;0.725;0.825;1" dur="6s" repeatCount="indefinite"/></rect>
<rect x="152" y="184" width="40" height="40" fill="#161b22" stroke="#c9d1d9" stroke-width="2"/>
</g>
<text x="39" y="79" font-size="10" font-weight="700" fill="#2dd4bf">1</text>
<text x="59" y="99" font-size="10" font-weight="700" fill="#4cc2ce">2</text>
<text x="79" y="119" font-size="10" font-weight="700" fill="#5cb9d5">3</text>
<text x="99" y="139" font-size="10" font-weight="700" fill="#6ab0dd">4</text>
<text x="119" y="159" font-size="10" font-weight="700" fill="#899deb">5</text>
<text x="139" y="179" font-size="10" font-weight="700" fill="#a78bfa">6</text>
<text x="172" y="209" text-anchor="middle" font-size="10" fill="#c9d1d9">tree</text>
<text x="172" y="366" text-anchor="middle" font-size="11" fill="#8b949e">outside in: network, then the project</text>
<g shape-rendering="crispEdges">
<rect x="340" y="56" width="588" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect x="340" y="56" width="4" height="52" fill="#2dd4bf"/>
<rect x="340" y="116" width="588" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect x="340" y="116" width="4" height="52" fill="#4cc2ce"/>
<rect x="340" y="176" width="588" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect x="340" y="176" width="4" height="52" fill="#5cb9d5"/>
<rect x="340" y="236" width="588" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect x="340" y="236" width="4" height="52" fill="#6ab0dd"/>
<rect x="340" y="296" width="588" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect x="340" y="296" width="4" height="52" fill="#899deb"/>
<rect x="340" y="356" width="588" height="52" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect x="340" y="356" width="4" height="52" fill="#a78bfa"/>
</g>
<text x="360" y="79" font-size="12" font-weight="700" fill="#2dd4bf">1</text>
<text x="382" y="79" font-size="13" font-weight="700" fill="#c9d1d9">Noise XX pairing</text>
<text x="916" y="79" text-anchor="end" font-size="11" fill="#2dd4bf">stops a man in the middle</text>
<text x="382" y="97" font-size="11" fill="#8b949e">a human compares an 8-character code; the host accepts within 120 s</text>
<text x="360" y="139" font-size="12" font-weight="700" fill="#4cc2ce">2</text>
<text x="382" y="139" font-size="13" font-weight="700" fill="#c9d1d9">pinned keys (Noise IK)</text>
<text x="916" y="139" text-anchor="end" font-size="11" fill="#4cc2ce">stops an impostor host</text>
<text x="382" y="157" font-size="11" fill="#8b949e">later connections skip the code; a changed host key is refused</text>
<text x="360" y="199" font-size="12" font-weight="700" fill="#5cb9d5">3</text>
<text x="382" y="199" font-size="13" font-weight="700" fill="#c9d1d9">confined to the root</text>
<text x="916" y="199" text-anchor="end" font-size="11" fill="#5cb9d5">stops path escapes</text>
<text x="382" y="217" font-size="11" fill="#8b949e">paths open beneath the project root; symlinks and .. cannot escape</text>
<text x="360" y="259" font-size="12" font-weight="700" fill="#6ab0dd">4</text>
<text x="382" y="259" font-size="13" font-weight="700" fill="#c9d1d9">gitignored stays home</text>
<text x="916" y="259" text-anchor="end" font-size="11" fill="#6ab0dd">stops secrets leaking</text>
<text x="382" y="277" font-size="11" fill="#8b949e">.env and friends are never served; editing .gitignore cannot widen it</text>
<text x="360" y="319" font-size="12" font-weight="700" fill="#899deb">5</text>
<text x="382" y="319" font-size="13" font-weight="700" fill="#c9d1d9">.git is read-only</text>
<text x="916" y="319" text-anchor="end" font-size="11" fill="#899deb">stops history rewrites</text>
<text x="382" y="337" font-size="11" fill="#8b949e">the guest reads history and cannot rewrite it</text>
<text x="360" y="379" font-size="12" font-weight="700" fill="#a78bfa">6</text>
<text x="382" y="379" font-size="13" font-weight="700" fill="#c9d1d9">bounded parsing</text>
<text x="916" y="379" text-anchor="end" font-size="11" fill="#a78bfa">stops memory exhaustion</text>
<text x="382" y="397" font-size="11" fill="#8b949e">every length is checked before it allocates; the decoders are fuzzed</text>
<g shape-rendering="crispEdges">
<rect x="32" y="428" width="218" height="32" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<rect x="258" y="428" width="218" height="32" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<rect x="484" y="428" width="218" height="32" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<rect x="710" y="428" width="218" height="32" fill="#161b22" stroke="#30363d" stroke-width="2"/>
</g>
<text x="141" y="448" text-anchor="middle" font-size="11" fill="#c9d1d9">20 handshakes/min per address</text>
<text x="367" y="448" text-anchor="middle" font-size="11" fill="#c9d1d9">key files must be private</text>
<text x="593" y="448" text-anchor="middle" font-size="11" fill="#c9d1d9">bytes checked with BLAKE3</text>
<text x="819" y="448" text-anchor="middle" font-size="11" fill="#c9d1d9">guest keeps nothing on exit</text>
</svg>
