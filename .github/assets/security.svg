<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<title id="t">csync security layers</title>
<desc id="d">Six nested layers around the project tree. One: Noise XX pairing with a code checked by a human. Two: pinned keys, Noise IK, on reconnect. Three: every file operation is confined to the project root with openat beneath, so symlinks cannot escape. Four: gitignored files never leave the host. Five: .git is read-only to the guest. Six: all parsing is bounded.</desc>
<style>@media (prefers-reduced-motion: reduce){.p{stroke-opacity:1!important}}</style>
<rect width="960" height="330" rx="18" fill="#0d1117"/>
<rect x="1" y="1" width="958" height="328" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
<g shape-rendering="crispEdges">
<rect class="p" x="40" y="40" width="260" height="260" fill="#0d1117" stroke="#2dd4bf" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.000;0.100;0.200;1" dur="6s" repeatCount="indefinite"/></rect>
<rect class="p" x="58" y="58" width="224" height="224" fill="none" stroke="#4cc2ce" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.125;0.225;0.325;1" dur="6s" repeatCount="indefinite"/></rect>
<rect class="p" x="76" y="76" width="188" height="188" fill="none" stroke="#5cb9d5" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.250;0.350;0.450;1" dur="6s" repeatCount="indefinite"/></rect>
<rect class="p" x="94" y="94" width="152" height="152" fill="none" stroke="#6ab0dd" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.375;0.475;0.575;1" dur="6s" repeatCount="indefinite"/></rect>
<rect class="p" x="112" y="112" width="116" height="116" fill="none" stroke="#899deb" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.500;0.600;0.700;1" dur="6s" repeatCount="indefinite"/></rect>
<rect class="p" x="130" y="130" width="80" height="80" fill="none" stroke="#a78bfa" stroke-width="3" stroke-opacity="0.55"><animate attributeName="stroke-opacity" values="0.55;0.55;1;0.55;0.55" keyTimes="0;0.625;0.725;0.825;1" dur="6s" repeatCount="indefinite"/></rect>
<rect x="148" y="148" width="44" height="44" fill="#161b22" stroke="#c9d1d9" stroke-width="2"/>
</g>
<text x="45" y="54" font-size="10" font-weight="700" fill="#2dd4bf">1</text>
<text x="63" y="72" font-size="10" font-weight="700" fill="#4cc2ce">2</text>
<text x="81" y="90" font-size="10" font-weight="700" fill="#5cb9d5">3</text>
<text x="99" y="108" font-size="10" font-weight="700" fill="#6ab0dd">4</text>
<text x="117" y="126" font-size="10" font-weight="700" fill="#899deb">5</text>
<text x="135" y="144" font-size="10" font-weight="700" fill="#a78bfa">6</text>
<text x="170" y="174" text-anchor="middle" font-size="11" fill="#c9d1d9">tree</text>
<rect x="340" y="44" width="596" height="36" fill="#161b22" stroke="#30363d" stroke-width="2" shape-rendering="crispEdges"/>
<rect x="340" y="44" width="4" height="36" fill="#2dd4bf" shape-rendering="crispEdges"/>
<text x="360" y="67" font-size="12" font-weight="700" fill="#2dd4bf">1</text>
<text x="384" y="67" font-size="13" font-weight="700" fill="#c9d1d9">Noise XX pairing</text>
<text x="600" y="67" font-size="12" fill="#8b949e">first contact; a human checks the code</text>
<rect x="340" y="88" width="596" height="36" fill="#161b22" stroke="#30363d" stroke-width="2" shape-rendering="crispEdges"/>
<rect x="340" y="88" width="4" height="36" fill="#4cc2ce" shape-rendering="crispEdges"/>
<text x="360" y="111" font-size="12" font-weight="700" fill="#4cc2ce">2</text>
<text x="384" y="111" font-size="13" font-weight="700" fill="#c9d1d9">pinned keys (Noise IK)</text>
<text x="600" y="111" font-size="12" fill="#8b949e">reconnects skip the code, keys must match</text>
<rect x="340" y="132" width="596" height="36" fill="#161b22" stroke="#30363d" stroke-width="2" shape-rendering="crispEdges"/>
<rect x="340" y="132" width="4" height="36" fill="#5cb9d5" shape-rendering="crispEdges"/>
<text x="360" y="155" font-size="12" font-weight="700" fill="#5cb9d5">3</text>
<text x="384" y="155" font-size="13" font-weight="700" fill="#c9d1d9">confined to the root</text>
<text x="600" y="155" font-size="12" fill="#8b949e">openat beneath the root, no symlink escape</text>
<rect x="340" y="176" width="596" height="36" fill="#161b22" stroke="#30363d" stroke-width="2" shape-rendering="crispEdges"/>
<rect x="340" y="176" width="4" height="36" fill="#6ab0dd" shape-rendering="crispEdges"/>
<text x="360" y="199" font-size="12" font-weight="700" fill="#6ab0dd">4</text>
<text x="384" y="199" font-size="13" font-weight="700" fill="#c9d1d9">gitignored stays home</text>
<text x="600" y="199" font-size="12" fill="#8b949e">ignored files never leave the host</text>
<rect x="340" y="220" width="596" height="36" fill="#161b22" stroke="#30363d" stroke-width="2" shape-rendering="crispEdges"/>
<rect x="340" y="220" width="4" height="36" fill="#899deb" shape-rendering="crispEdges"/>
<text x="360" y="243" font-size="12" font-weight="700" fill="#899deb">5</text>
<text x="384" y="243" font-size="13" font-weight="700" fill="#c9d1d9">.git is read-only</text>
<text x="600" y="243" font-size="12" fill="#8b949e">the guest reads history, cannot rewrite it</text>
<rect x="340" y="264" width="596" height="36" fill="#161b22" stroke="#30363d" stroke-width="2" shape-rendering="crispEdges"/>
<rect x="340" y="264" width="4" height="36" fill="#a78bfa" shape-rendering="crispEdges"/>
<text x="360" y="287" font-size="12" font-weight="700" fill="#a78bfa">6</text>
<text x="384" y="287" font-size="13" font-weight="700" fill="#c9d1d9">bounded parsing</text>
<text x="600" y="287" font-size="12" fill="#8b949e">every frame and field has a size limit</text>
</svg>
