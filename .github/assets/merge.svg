<rect x="361" y="182" width="8" height="7" fill="#30363d"/><rect x="377" y="182" width="170" height="7" fill="#3d444d"/>
<rect x="361" y="197" width="8" height="7" fill="#30363d"/><rect x="377" y="197" width="96" height="7" fill="#3d444d"/>
<rect x="361" y="212" width="8" height="7" fill="#30363d"/><rect x="377" y="212" width="120" height="7" fill="#3d444d"/>
<rect x="361" y="227" width="8" height="7" fill="#30363d"/><rect x="377" y="227" width="104" height="7" fill="#3d444d"/>
<rect x="361" y="242" width="8" height="7" fill="#30363d"/><rect x="377" y="242" width="180" height="7" fill="#3d444d"/>
</g>
<text x="601" y="144" text-anchor="end" font-size="10" fill="#2dd4bf">host</text>
<text x="601" y="219" text-anchor="end" font-size="10" fill="#a78bfa">guest</text>
<rect x="351" y="268" width="156" height="26" fill="#161b22" stroke="#3fb950" stroke-width="2" shape-rendering="crispEdges"/>
<text x="363" y="286" font-size="13" font-weight="700" fill="#3fb950">clean 3-way merge</text>
<text x="351" y="316" font-size="11" fill="#8b949e">both edits land</text>
<text x="351" y="334" font-size="11" fill="#8b949e">nobody is asked anything</text>
<rect x="646" y="52" width="290" height="296" fill="#0d1117" stroke="#30363d" stroke-width="4" shape-rendering="crispEdges"/>
<text x="662" y="80" font-size="13" font-weight="700" fill="#c9d1d9">3  hunks overlap</text>
<text x="662" y="98" font-size="11" fill="#8b949e">the earlier write wins</text>
<g shape-rendering="crispEdges">
<rect x="662" y="112" width="258" height="144" fill="#161b22"/>
<g><rect x="664" y="149" width="254" height="13" fill="#2dd4bf" opacity="0.16"/><rect x="664" y="149" width="3" height="13" fill="#2dd4bf"/></g>
<g><rect x="664" y="164" width="254" height="13" fill="#2dd4bf" opacity="0.16"/><rect x="664" y="164" width="3" height="13" fill="#2dd4bf"/></g>
<g class="f"><animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.35;0.55;0.9;1" dur="5s" repeatCount="indefinite"/><rect x="664" y="164" width="254" height="13" fill="#a78bfa" opacity="0.16"/><rect x="664" y="164" width="3" height="13" fill="#a78bfa"/></g>
<g class="f"><animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.35;0.55;0.9;1" dur="5s" repeatCount="indefinite"/><rect x="664" y="179" width="254" height="13" fill="#a78bfa" opacity="0.16"/><rect x="664" y="179" width="3" height="13" fill="#a78bfa"/></g>
<rect x="664" y="164" width="254" height="13" fill="none" stroke="#ff7b72" stroke-width="2"/>
<rect x="672" y="122" width="8" height="7" fill="#30363d"/><rect x="688" y="122" width="150" height="7" fill="#3d444d"/>
<rect x="672" y="137" width="8" height="7" fill="#30363d"/><rect x="688" y="137" width="120" height="7" fill="#3d444d"/>
