<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<title id="t">How fast csync is</title>
<desc id="d">Two panels of measured medians. Reading a 17,403-file project through the mount, each command on its own scale: find -type f takes 20 ms native, 115 ms on the first csync run and 14 ms on a repeat; git status takes 23 ms native, 44 ms first run, 18 ms repeat; rg over the tree takes 47 ms native, 469 ms first run, 123 ms repeat. Latency: host edit to guest inotify event 2.2 ms; write and close on the guest 0.66 ms; save via temp file and rename 1.1 ms; join to a usable mount 85 ms; idle uses 0 CPU and 0 wakeups. Measured in Docker, Linux arm64, over loopback; medians of three runs; native is the same command on the host directory.</desc>
<style>@media (prefers-reduced-motion: reduce){.m{display:none}}</style>
<rect width="960" height="370" rx="18" fill="#0d1117"/>
<rect x="1" y="1" width="958" height="368" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
<text x="24" y="34" font-size="13" font-weight="700" fill="#c9d1d9">how fast it is</text>
<text x="936" y="34" text-anchor="end" font-size="12" fill="#8b949e">milliseconds, lower is better</text>
<rect x="24" y="52" width="592" height="280" fill="#0d1117" stroke="#30363d" stroke-width="4" shape-rendering="crispEdges"/>
<text x="40" y="80" font-size="13" font-weight="700" fill="#c9d1d9">reading a 17,403-file project through the mount</text>
<text x="40" y="98" font-size="11" fill="#8b949e">each command has its own scale: bars compare within a group only</text>
<text x="40" y="124" font-size="12" font-weight="700" fill="#c9d1d9">find -type f</text>
<text x="600" y="124" text-anchor="end" font-size="10" fill="#8b949e">scale 0-115 ms</text>
<g shape-rendering="crispEdges">
<text x="52" y="142" font-size="11" fill="#8b949e">native</text>
<rect x="128" y="133" width="66.1" height="11" fill="#6e7681"/>
<text x="202.1" y="142" font-size="11" fill="#c9d1d9">20 ms</text>
<text x="52" y="158" font-size="11" fill="#8b949e">first run</text>
<rect x="128" y="149" width="380.0" height="11" fill="#a78bfa"/>
<text x="516.0" y="158" font-size="11" fill="#c9d1d9">115 ms</text>
<text x="52" y="174" font-size="11" fill="#8b949e">repeat</text>
<rect x="128" y="165" width="46.3" height="11" fill="#2dd4bf"/>
<text x="182.3" y="174" font-size="11" fill="#c9d1d9">14 ms</text>
<rect class="m" x="580" y="132" width="0" height="48" fill="#0d1117"><animate attributeName="x" values="128;580" dur="0.9s" fill="freeze"/><animate attributeName="width" values="452;0" dur="0.9s" fill="freeze"/></rect>
</g>
<text x="40" y="192" font-size="12" font-weight="700" fill="#c9d1d9">git status</text>
<text x="600" y="192" text-anchor="end" font-size="10" fill="#8b949e">scale 0-44 ms</text>
<g shape-rendering="crispEdges">
<text x="52" y="210" font-size="11" fill="#8b949e">native</text>
<rect x="128" y="201" width="198.6" height="11" fill="#6e7681"/>
<text x="334.6" y="210" font-size="11" fill="#c9d1d9">23 ms</text>
<text x="52" y="226" font-size="11" fill="#8b949e">first run</text>
<rect x="128" y="217" width="380.0" height="11" fill="#a78bfa"/>
<text x="516.0" y="226" font-size="11" fill="#c9d1d9">44 ms</text>
<text x="52" y="242" font-size="11" fill="#8b949e">repeat</text>
<rect x="128" y="233" width="155.5" height="11" fill="#2dd4bf"/>
<text x="291.5" y="242" font-size="11" fill="#c9d1d9">18 ms</text>
<rect class="m" x="580" y="200" width="0" height="48" fill="#0d1117"><animate attributeName="x" values="128;580" dur="0.9s" fill="freeze"/><animate attributeName="width" values="452;0" dur="0.9s" fill="freeze"/></rect>
</g>
<text x="40" y="260" font-size="12" font-weight="700" fill="#c9d1d9">rg over the tree</text>
<text x="600" y="260" text-anchor="end" font-size="10" fill="#8b949e">scale 0-469 ms</text>
<g shape-rendering="crispEdges">
<text x="52" y="278" font-size="11" fill="#8b949e">native</text>
<rect x="128" y="269" width="38.1" height="11" fill="#6e7681"/>
<text x="174.1" y="278" font-size="11" fill="#c9d1d9">47 ms</text>
<text x="52" y="294" font-size="11" fill="#8b949e">first run</text>
<rect x="128" y="285" width="380.0" height="11" fill="#a78bfa"/>
<text x="516.0" y="294" font-size="11" fill="#c9d1d9">469 ms</text>
<text x="52" y="310" font-size="11" fill="#8b949e">repeat</text>
<rect x="128" y="301" width="99.7" height="11" fill="#2dd4bf"/>
<text x="235.7" y="310" font-size="11" fill="#c9d1d9">123 ms</text>
<rect class="m" x="580" y="268" width="0" height="48" fill="#0d1117"><animate attributeName="x" values="128;580" dur="0.9s" fill="freeze"/><animate attributeName="width" values="452;0" dur="0.9s" fill="freeze"/></rect>
</g>
<rect x="636" y="52" width="300" height="280" fill="#0d1117" stroke="#30363d" stroke-width="4" shape-rendering="crispEdges"/>
<text x="652" y="80" font-size="13" font-weight="700" fill="#c9d1d9">latency</text>
<text x="652" y="98" font-size="11" fill="#8b949e">medians</text>
<text x="652" y="128" font-size="20" font-weight="700" fill="#2dd4bf">2.2 ms</text>
<text x="652" y="144" font-size="11" fill="#8b949e">host edit -&gt; guest inotify event</text>
<text x="652" y="172" font-size="20" font-weight="700" fill="#2dd4bf">0.66 ms</text>
<text x="652" y="188" font-size="11" fill="#8b949e">write and close on the guest</text>
<text x="652" y="216" font-size="20" font-weight="700" fill="#2dd4bf">1.1 ms</text>
<text x="652" y="232" font-size="11" fill="#8b949e">save via temp file and rename</text>
<text x="652" y="260" font-size="20" font-weight="700" fill="#2dd4bf">85 ms</text>
<text x="652" y="276" font-size="11" fill="#8b949e">join to a usable mount</text>
<text x="652" y="304" font-size="20" font-weight="700" fill="#2dd4bf">0 CPU, 0 wakeups</text>
<text x="652" y="320" font-size="11" fill="#8b949e">when idle</text>
<text x="24" y="354" font-size="11" fill="#8b949e">Docker, Linux arm64, loopback; medians of three runs; native = same command on the host directory</text>
</svg>
