<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<title id="t">csync: one tree, two machines</title>
<desc id="d">A Mac host, the source of truth, on the left and a Linux guest on the right, joined by an encrypted link. File changes travel both ways along the link. A pairing code chip reads 7KQ4 M2XD. The guest sees the project as a FUSE mount, so two coding agents can work on one tree at once.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
</defs>
