<text x="656" y="76" font-size="14" font-weight="700" fill="#c9d1d9">guest</text>
<text x="916" y="76" text-anchor="end" font-size="12" fill="#8b949e">Linux</text>

<g shape-rendering="crispEdges" fill="#161b22" stroke="#30363d" stroke-width="2">
<rect x="44" y="92" width="260" height="44"/>
<rect x="44" y="152" width="260" height="44"/>
