<rect x="656" y="212" width="260" height="44"/>
<rect x="656" y="272" width="260" height="44" stroke-dasharray="6 4"/>
</g>
<g shape-rendering="crispEdges" fill="#30363d">
<rect x="172" y="137" width="4" height="10"/><path d="M168 146h12l-6 6z"/>
<rect x="172" y="197" width="4" height="10"/><path d="M168 206h12l-6 6z"/>
<rect x="784" y="137" width="4" height="10"/><path d="M780 146h12l-6 6z"/>
<rect x="784" y="197" width="4" height="10"/><path d="M780 206h12l-6 6z"/>
</g>

<g font-size="13" font-weight="700" fill="#c9d1d9">
<text x="58" y="111">FSEvents watcher</text>
<text x="58" y="171">index</text>
<text x="58" y="231">committer / serve</text>
<text x="670" y="111">FUSE mount</text>
<text x="670" y="171">in-memory tree</text>
<text x="670" y="231">blob cache</text>
<text x="670" y="291">local overlay</text>
</g>
<g font-size="11" fill="#8b949e">
<text x="58" y="127">sees every change on disk</text>
<text x="58" y="187">path -&gt; hash, version</text>
<text x="58" y="247">CAS commits, blob bytes</text>
<text x="670" y="127">the agent's working tree</text>
<text x="670" y="187">stat, readdir answered here</text>
<text x="670" y="247">content-addressed bytes</text>
<text x="670" y="307">gitignored paths stay here</text>
</g>
<text x="58" y="292" font-size="12" font-weight="700" fill="#2dd4bf">source of truth</text>
<text x="58" y="310" font-size="11" fill="#8b949e">the real files on the Mac</text>

<rect x="356" y="92" width="248" height="224" fill="#0d1117" stroke="url(#g)" stroke-width="2" stroke-dasharray="4 4" shape-rendering="crispEdges"/>
<text x="480" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#c9d1d9">Noise-encrypted link</text>

<g font-size="12" font-weight="700" text-anchor="middle">
<text x="480" y="142" fill="#2dd4bf">metadata</text>
<text x="480" y="206" fill="#a78bfa">reads</text>
<text x="480" y="270" fill="#3fb950">writes</text>
</g>
<g font-size="11" fill="#8b949e" text-anchor="middle">
<text x="480" y="170">zero round trips</text>
<text x="480" y="234">cache, then fetch</text>
<text x="480" y="298">CAS commit, merge or refuse</text>
</g>

