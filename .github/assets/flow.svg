<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<title id="t">How csync works</title>
<desc id="d">Architecture. The macOS host runs an FSEvents watcher that feeds an index, and a committer that also serves file bytes. The Linux guest runs a FUSE mount backed by an in-memory tree, a blob cache and a local overlay for gitignored paths. They talk over a Noise-encrypted link with three data paths: metadata needs zero round trips, reads hit the cache then fetch, and writes are compare-and-swap commits that merge or are refused.</desc>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
</defs>
<style>@media (prefers-reduced-motion: reduce){.d{stroke-dashoffset:0!important}.m{display:none}}</style>
<rect width="960" height="360" rx="18" fill="#0d1117"/>
<rect x="1" y="1" width="958" height="358" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>

<g shape-rendering="crispEdges" fill="#0d1117" stroke-width="4">
<rect x="24" y="48" width="300" height="288" stroke="#2dd4bf"/>
<rect x="636" y="48" width="300" height="288" stroke="#a78bfa"/>
</g>
