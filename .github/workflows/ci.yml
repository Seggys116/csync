name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# main runs are never cancelled: release.yml requires a finished green run for the tagged sha
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      # the intel mac release target, checked on the arm runner that already has the deps built
      - if: runner.os == 'macOS'
        run: cargo check --locked --all-targets --target x86_64-apple-darwin

  # the fat-lto release build happens once per arch and doubles as the musl target check
  musl:
    name: musl (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: musl
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --release --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csync-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/csync
          if-no-files-found: error
          retention-days: 1

  fuse:
    name: fuse (${{ matrix.os }}, ${{ matrix.priv }})
    needs: musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        priv: [user, root]
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    env:
      CSYNC_IT_PRIV: ${{ matrix.priv }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fuse3 inotify-tools
          test -c /dev/fuse || sudo modprobe fuse
          test -c /dev/fuse
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fuse
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.priv == 'user' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: csync-${{ matrix.target }}
          path: ${{ runner.temp }}/csync-bin
      # artifacts drop the executable bit
      - run: chmod 755 "$RUNNER_TEMP/csync-bin/csync"
      - name: fuse_it
        shell: bash
        env:
          CSYNC_BIN: ${{ runner.temp }}/csync-bin/csync
        run: |
          if [ "$CSYNC_IT_PRIV" = root ]; then
            # build as the runner user so target/ stays user-owned, then run only the test binary as root
            bin="$(cargo test --locked --test fuse_it --no-run --message-format=json \
              | jq -r 'select(.reason == "compiler-artifact" and .target.name == "fuse_it" and .executable != null) | .executable')"
            test -x "$bin"
            sudo --preserve-env=CSYNC_BIN,CSYNC_IT_PRIV,RUST_BACKTRACE "$bin" --test-threads=1
          else
            cargo test --locked --test fuse_it -- --test-threads=1
          fi

  # experimental: whether macFUSE (FSKit backend) can run on a hosted macOS runner; never blocks merging, not in ci-ok
  macfuse:
    name: macfuse (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    env:
      CSYNC_BIN: ${{ github.workspace }}/target/release/csync
      FSKIT_ID: io.macfuse.app.fsmodule.macfuse
      FSKIT_LOCAL_ID: io.macfuse.app.fsmodule.macfuse-local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macfuse
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --release
      - name: diagnostics before install
        if: always()
        shell: bash
        run: |
          echo "::group::system"
          sw_vers; uname -a; csrutil status || true; sysctl -n machdep.cpu.brand_string; sysctl -n kern.hv_vmm_present || true
          echo "::endgroup::"
          echo "::group::doctor"; "$CSYNC_BIN" doctor || true; echo "::endgroup::"
      - name: install macfuse
        shell: bash
        run: |
          set -x
          brew install --cask macfuse
          echo "install exit: $?"
      - name: diagnostics after install
        if: always()
        shell: bash
        run: |
          echo "::group::macfuse version"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /Library/Filesystems/macfuse.fs/Contents/Info.plist || true
          ls -la /Library/Filesystems/macfuse.fs/Contents /Library/Filesystems/macfuse.fs/Contents/Extensions 2>&1 || true
          find /Library/Filesystems/macfuse.fs -name '*.appex' 2>/dev/null || true
          ls -la /usr/local/lib | grep -i fuse || true
          echo "::endgroup::"
          echo "::group::pluginkit"; pluginkit -m -A -vvv 2>&1 | grep -i -B1 -A8 fuse || true; echo "::endgroup::"
          echo "::group::kmutil"; kmutil showloaded 2>&1 | grep -i fuse || echo "no fuse kext loaded"; echo "::endgroup::"
          echo "::group::systemextensionsctl"; systemextensionsctl list 2>&1 || true; echo "::endgroup::"
          echo "::group::doctor"; "$CSYNC_BIN" doctor || true; echo "::endgroup::"
      - name: enable the FSKit module
        if: always()
        shell: bash
        run: |
          appex_dir=/Library/Filesystems/macfuse.fs/Contents/Resources/macfuse.app/Contents/Extensions
          for id in "$FSKIT_ID" "$FSKIT_LOCAL_ID"; do
            echo "::group::enable $id"
            pluginkit -a "$appex_dir/$id.appex"; echo "pluginkit -a: $?"
            pluginkit -e use -i "$id"; echo "pluginkit -e use: $?"
            pluginkit -m -i "$id" -vvv || true
            echo "::endgroup::"
          done
      - name: fskit enablement state
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/fsext.swift" <<'EOF'
          import FSKit
          import Foundation
          let sem = DispatchSemaphore(value: 0)
          FSClient.shared.fetchInstalledExtensions { exts, err in
              for e in exts ?? [] { print("\(e.bundleIdentifier) enabled=\(e.isEnabled)") }
              if let err { print("error: \(err)") }
              sem.signal()
          }
          if sem.wait(timeout: .now() + 20) == .timedOut { print("timed out") }
          EOF
          swiftc -o "$RUNNER_TEMP/fsext" "$RUNNER_TEMP/fsext.swift"
          echo "::group::FSClient view before restarting the daemons"; "$RUNNER_TEMP/fsext"; echo "::endgroup::"
          echo "::group::fskit settings container"
          g="$HOME/Library/Group Containers/group.com.apple.fskit.settings"
          ls -laR "$g" 2>&1 | head -30
          for f in "$g"/*.plist "$g"/Library/Preferences/*.plist; do [ -f "$f" ] && { echo "-- $f"; plutil -p "$f"; }; done
          echo "::endgroup::"
          echo "::group::restart fskitd and fskit_agent"
          sudo killall fskitd fskit_agent 2>&1 || true
          sleep 3
          "$RUNNER_TEMP/fsext"
          echo "::endgroup::"
          "$CSYNC_BIN" doctor | grep -i fskit || true
      - name: macguest test
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/macguest.log"
          cargo test --locked --release --test fuse_macguest -- --nocapture 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          {
            echo "### macfuse (${{ matrix.os }}, macOS $(sw_vers -productVersion))"
            if grep -q '^skip:' "$log"; then
              echo "DID NOT RUN: $(grep -m1 '^skip:' "$log")"
              rc=1
            elif [ "$rc" -ne 0 ]; then
              echo "FAILED (exit $rc)"
            elif ! grep -q 'test result: ok. 1 passed' "$log"; then
              echo "FAILED: no passing test was reported"
              rc=1
            else
              echo "passed: mounted, read, host to guest, guest to host, ignored path, unmount and wipe"
            fi
            grep -a '^fsevents ' "$log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: mount state and logs
        if: always()
        shell: bash
        run: |
          mount | grep -i -E 'fuse|csync|fskit' || echo "nothing fuse-like in the mount table"
          log show --predicate 'process BEGINSWITH "io.macfuse" OR process == "macfuse" OR process == "fskitd" OR process == "fskit_agent" OR process == "csync"' --last 15m --style compact > "$RUNNER_TEMP/unified.log" 2>&1 || true
          echo "== macfuse and fskit error lines"
          grep -a -E ' (E|F) +(io\.macfuse|fskitd|fskit_agent|csync)' "$RUNNER_TEMP/unified.log" | grep -a -v -E 'libsqlite3|DetachedSignatures' | tail -40 || true
          echo "== macfuse daemon lines"
          grep -a 'io.macfuse:' "$RUNNER_TEMP/unified.log" | tail -40 || true

  install-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh -n install.sh
      - run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          shellcheck --shell=sh install.sh

  # the single required check for branch protection; always() because a skipped job would count as passing
  ci-ok:
    if: always()
    needs: [fmt, test, musl, fuse, install-scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | jq -e 'all(.[]; .result == "success")'
