name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  preflight:
    name: verify release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: require matching version and green ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          CI_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/ci.yml
        run: |
          set -euo pipefail
          version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::tag $RELEASE_TAG does not match package version v$version"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          if ! runs="$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$sha" -f per_page=100)"; then
            echo "::error::cannot query ci runs for $sha: $CI_WORKFLOW_URL"
            exit 1
          fi
          run="$(jq -c --arg sha "$sha" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")] | sort_by([.created_at, .id]) | last' <<< "$runs")"
          if [ -z "$run" ] || [ "$run" = null ]; then
            echo "::error::no main push ci run for $sha: $CI_WORKFLOW_URL"
            exit 1
          fi
          status="$(jq -r '.status // "unknown"' <<< "$run")"
          conclusion="$(jq -r '.conclusion // "none"' <<< "$run")"
          url="$(jq -r --arg u "$CI_WORKFLOW_URL" '.html_url // $u' <<< "$run")"
          if [ "$status" != completed ] || [ "$conclusion" != success ]; then
            echo "::error::latest main push ci for $sha is $status/$conclusion: $url"
            exit 1
          fi
          echo "verified $RELEASE_TAG at $sha against $url"

  build:
    name: build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    env:
      TARGET: ${{ matrix.target }}
    # no rust-cache here: release binaries are built from a clean tree, never from a restored cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - run: cargo build --locked --release --target "$TARGET"
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="csync-$TARGET"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage" dist
          cp "target/$TARGET/release/csync" LICENSE README.md "$stage/"
          chmod 755 "$stage/csync"
          # flat archive with exactly these three entries; install.sh rejects anything else
          COPYFILE_DISABLE=1 tar -czf "dist/$name.tar.gz" -C "$stage" csync LICENSE README.md
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      # artifact attestations need a public repo (or enterprise cloud for private ones)
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/csync-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csync-${{ matrix.target }}
          path: |
            dist/csync-${{ matrix.target }}.tar.gz
            dist/csync-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: csync-*
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: |
          sha256sum -c ./*.sha256
          sha256sum csync-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" dist/*
