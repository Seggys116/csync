[package]
name = "csync"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Two-way code sync for a macOS host and a Linux FUSE guest"
license = "MIT"
repository = "https://github.com/Seggys116/csync"
authors = ["Zak Noble-Clarke"]
keywords = ["sync", "fuse", "remote-development", "vm", "filesystem"]
categories = ["filesystem", "command-line-utilities", "development-tools"]
exclude = [".github/", ".claude/", "install.sh"]

[lib]
name = "csync"
path = "src/lib.rs"

[[bin]]
name = "csync"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
postcard = { version = "1.2.0", features = ["use-std"] }
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
lz4_flex = { version = "0.14.2", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
fastcdc = "5.0.0"
snow = { version = "0.10.0", default-features = false, features = ["std", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
zeroize = { version = "1.9.2", features = ["derive"] }
getrandom = "0.4.3"
similar = "3.2.1"
rkyv = "0.8.18"
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
socket2 = "0.6.5"
mdns-sd = "0.22.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
clap = { version = "4.6.10", features = ["derive"] }
ignore = "0.4.35"
rustc-hash = "2.1.3"
mimalloc = { version = "0.1.52", default-features = false }
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs", "process", "thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", features = ["CFArray", "CFString", "CFUUID"] }
objc2-core-services = { version = "0.3.2", features = ["FSEvents", "dispatch2"] }
dispatch2 = "0.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11.5", default-features = false }
fuser = { version = "=0.19.0", default-features = false }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
